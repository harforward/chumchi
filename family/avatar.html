<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chumchi — Avatar Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; }

    /* 90s software palette */
    :root {
      --win-bg:    #F0EEF8;
      --win-dark:  rgba(120,100,180,0.5);
      --win-light: #FFFFFF;
      --win-face:  #000080;
      --title-bar: linear-gradient(90deg, #2A2060, #4060B0);
      --cream:     #FDF6EC;
      --bark:      #6B4F3A;
      --clay:      #C4785A;
      --neon-c:    #00D4FF;
      --neon-m:    #FF00C8;
    }

    body {
      background: #F0EEF8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Title bar ── */
    .titlebar {
      background: var(--title-bar);
      padding: 3px 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .titlebar-icon { font-size: 11px; }
    .titlebar-text {
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 600;
      color: white; letter-spacing: 0.04em;
      flex: 1;
    }
    .titlebar-btns { display: flex; gap: 2px; }
    .win-btn {
      width: 16px; height: 14px;
      background: #EEEAF8;
      border: 1px solid rgba(120,100,180,0.18);
      font-size: 8px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #000; line-height: 1;
    }
    .win-btn.close { font-size: 10px; }

    /* ── Menu bar ── */
    .menubar {
      background: #F4F2FC;
      border-bottom: 1px solid rgba(120,100,180,0.12);
      padding: 2px 6px;
      display: flex;
      gap: 0;
      flex-shrink: 0;
    }
    .menu-item {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      padding: 2px 8px;
      cursor: pointer;
      color: #000;
      text-decoration: none;
      display: flex; align-items: center; gap: 3px;
    }
    .menu-item:hover { background: #5040A0; color: white; border-radius: 3px; }
    .menu-underline { text-decoration: underline; }

    /* ── Main window body ── */
    .win-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 0;
      overflow: hidden;
      max-height: calc(100vh - 56px);
    }
    @media (max-width: 680px) {
      .win-body { grid-template-columns: 1fr; max-height: none; overflow: auto; }
      .preview-panel { order: -1; }
    }

    /* ── Left: traits panel ── */
    .traits-panel {
      background: #F8F6FF;
      border-right: 1px solid rgba(120,100,180,0.15);
      overflow-y: auto;
      overflow-x: hidden;
    }
    .traits-panel::-webkit-scrollbar { width: 8px; }
    .traits-panel::-webkit-scrollbar-track { background: #F0EEF8; }
    .traits-panel::-webkit-scrollbar-thumb {
      background: rgba(120,100,180,0.3);
      border-radius: 4px;
    }

    /* Category tabs — toolbar style */
    .cat-toolbar {
      background: #EEEAF8;
      border-bottom: 1px solid rgba(120,100,180,0.15);
      padding: 4px 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
    }
    .cat-btn {
      font-family: 'Inter', sans-serif;
      font-size: 10px; font-weight: 500;
      padding: 2px 7px;
      background: #F4F2FC;
      border: 1px solid rgba(120,100,180,0.2);
      cursor: pointer;
      color: #000;
      white-space: nowrap;
    }
    .cat-btn:active { background: #E0DCF8; }
    .cat-btn.active {
      background: #6050A0;
      color: white;
      border-color: #6050A0;
    }

    /* Trait sections */
    .tsec {
      padding: 6px;
      border-bottom: 1px solid rgba(120,100,180,0.15);
      scroll-margin-top: 40px;
    }
    .tsec-head {
      font-family: 'Inter', sans-serif;
      font-size: 10px; font-weight: 700;
      color: #4040A0;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 0 4px;
      display: flex; align-items: center; gap: 4px;
      cursor: pointer;
      user-select: none;
    }
    .tsec-head::before {
      content: '▼';
      font-size: 8px;
      color: #808080;
      transition: transform 0.18s;
    }
    .tsec-head.closed::before { transform: rotate(-90deg); }

    /* Trait grid — small tiles */
    .tgrid {
      display: grid;
      gap: 3px;
    }
    .tgrid.hidden { display: none; }

    .ttile {
      background: #F8F6FF;
      border: 1.5px outset #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3px 2px;
      transition: all 0.1s;
      aspect-ratio: 1;
      min-height: 0;
    }
    .ttile:hover { background: #EAE6FF; }
    .ttile:active { background: #DDD8F8; }
    .ttile.sel {
      background: #E0D8FF;
      border: 1.5px solid #6050A0;
      outline: none;
      outline-offset: -3px;
    }
    .ttile canvas { width: 100%; height: auto; display: block; }
    .ttile-lbl {
      font-family: 'Inter', sans-serif;
      font-size: 8px;
      color: #000;
      text-align: center;
      line-height: 1.1;
      margin-top: 2px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }
    .ttile-none {
      font-size: 9px; color: rgba(80,60,120,0.5);
      font-family: 'Inter', sans-serif;
    }

    /* ── Right: preview panel ── */
    .preview-panel {
      background: #F4F2FC;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .preview-title {
      background: #EEEAF8;
      border-bottom: 1px solid rgba(120,100,180,0.15);
      padding: 4px 8px;
      font-family: 'Inter', sans-serif;
      font-size: 10px; font-weight: 700;
      color: #4040A0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Avatar display area — dark border like monitor */
    .avatar-display {
      background: #000;
      border: 3px solid rgba(60,40,100,0.35);
      border-radius: 6px;
      margin: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      position: relative;
    }
    /* CRT scanlines overlay */
    .avatar-display::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
    }

    /* Inner screen - slightly glowing */
    .screen-inner {
      background: #1A1A1A;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    #faceCanvas, #bodyCanvas {
      display: block;
      /* subtle green-tint monitor glow */
      filter: drop-shadow(0 0 6px rgba(0,200,120,0.25));
    }
    #bodyCanvas { display: none; }

    /* View toggle — tab style */
    .view-tabs {
      display: flex;
      border-bottom: 1px solid rgba(120,100,180,0.15);
      margin: 0 8px;
      background: #EEEAF8;
    }
    .vtab {
      font-family: 'Inter', sans-serif;
      font-size: 10px; font-weight: 600;
      padding: 3px 12px;
      cursor: pointer;
      background: #F4F2FC;
      border: 1px solid rgba(120,100,180,0.18);
      border-bottom: none;
      color: #000;
      margin-bottom: -1px;
      position: relative;
    }
    .vtab.active {
      background: #F8F6FF;
      border-bottom: 1px solid #F8F6FF;
      z-index: 1;
    }

    /* Controls area */
    .controls {
      padding: 6px 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }

    .ctrl-label {
      font-family: 'Inter', sans-serif;
      font-size: 10px; font-weight: 700;
      color: #4040A0;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    /* Skin — WIN95 style slider */
    .skin-row { display: flex; align-items: center; gap: 6px; }
    #skinSlider {
      flex: 1; height: 20px;
      -webkit-appearance: none; appearance: none;
      background: linear-gradient(to right,
        #FDEBD8 0%, #D4956A 25%, #4A2010 45%,
        #6040FF 60%, #00B8FF 75%, #00D880 88%, #FF40C0 100%
      );
      border: 1px solid rgba(120,100,180,0.2);
      border-radius: 4px;
      cursor: pointer;
    }
    #skinSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 22px;
      background: #F0EEF8;
      border: 1px solid rgba(120,100,180,0.2);
      cursor: pointer;
    }
    .skin-swatch {
      width: 24px; height: 18px;
      border: 1px solid rgba(120,100,180,0.25);
      flex-shrink: 0;
    }

    /* Saved looks — WIN95 icon style */
    .looks-grid { display: flex; gap: 4px; }
    .look-slot {
      width: 52px; height: 52px;
      border: 1.5px solid rgba(120,100,180,0.22);
      border-radius: 6px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: #E8E4DC;
      overflow: hidden;
      position: relative;
    }
    .look-slot:hover { background: #EAE6FF; }
    .look-slot.filled { background: #E0D8FF; border-color: #6050A0; }
    .look-slot canvas { width: 100%; height: 100%; }
    .look-lbl {
      font-size: 8px; text-align: center;
      font-family: 'Inter', sans-serif; color: #000;
      margin-top: 2px;
    }

    /* Action buttons — WIN95 style */
    .btn-bar {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .wbtn {
      font-family: 'Inter', sans-serif;
      font-size: 10px; font-weight: 600;
      padding: 4px 10px;
      background: #F0EEF8;
      border: 1px solid rgba(120,100,180,0.22);
      cursor: pointer;
      color: #000;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .wbtn:active { background: #E0DCF8; transform: translate(1px,1px); }
    .wbtn:hover { background: #E8E4F8; }
    .wbtn.primary {
      background: #5040A0;
      color: white;
      border-color: #6050B0;
    }
    .wbtn.primary:hover { background: #6050B0; }
    .wbtn.fun {
      background: linear-gradient(90deg, #FF6B9D, #A259FF);
      color: white;
      border-color: #A259FF;
    }

    /* Status bar */
    .statusbar {
      background: #EEEAF8;
      border-top: 1px solid rgba(120,100,180,0.15);
      padding: 2px 8px;
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      color: #000;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .status-cell {
      border: 1px solid rgba(120,100,180,0.15);
      border-radius: 3px;
      padding: 1px 6px;
      flex: 1;
    }

    /* Save modal */
    .modal-bg {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 999;
      align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .win-dialog {
      background: #F4F2FC;
      border: 1px solid rgba(120,100,180,0.22);
      border-radius: 10px;
      min-width: 260px;
    }
    .win-dialog-title {
      background: var(--title-bar);
      padding: 3px 8px;
      display: flex; align-items: center; justify-content: space-between;
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 700;
      color: white;
    }
    .win-dialog-body {
      padding: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: #000;
    }
    .win-dialog-btns {
      display: flex; gap: 6px; justify-content: center;
      padding: 0 12px 10px;
    }
  </style>
</head>
<body>

<!-- Title bar -->
<div class="titlebar">
  <span class="titlebar-icon">🥄</span>
  <span class="titlebar-text">Avatar Studio — Chumchi Family Recipe Platform</span>
  <div class="titlebar-btns">
    <div class="win-btn">_</div>
    <div class="win-btn">□</div>
    <div class="win-btn close" onclick="skipAvatar()">✕</div>
  </div>
</div>

<!-- Menu bar -->
<div class="menubar">
  <a class="menu-item" href="tree.html"><span class="menu-underline">F</span>ile → Back to Tree</a>
  <div class="menu-item" onclick="randomize()"><span class="menu-underline">R</span>andom</div>
  <div class="menu-item" onclick="openSaveModal()"><span class="menu-underline">S</span>ave Look</div>
  <div class="menu-item" onclick="confirmAvatar()"><span class="menu-underline">U</span>se This ✓</div>
</div>

<!-- Main body -->
<div class="win-body">

  <!-- Left: traits -->
  <div class="traits-panel" id="traitsPanel">
    <div class="cat-toolbar" id="catToolbar"></div>
    <div id="traitsContainer"></div>
  </div>

  <!-- Right: preview -->
  <div class="preview-panel">
    <div class="preview-title">▶ Preview</div>

    <div class="view-tabs">
      <div class="vtab active" onclick="setView('face',this)">Face</div>
      <div class="vtab" onclick="setView('body',this)">Full Body</div>
    </div>

    <div class="avatar-display">
      <div class="screen-inner">
        <canvas id="faceCanvas" width="200" height="200"></canvas>
        <canvas id="bodyCanvas" width="180" height="280"></canvas>
      </div>
    </div>

    <div class="controls">
      <div>
        <div class="ctrl-label">Skin Tone</div>
        <div class="skin-row">
          <input type="range" id="skinSlider" min="0" max="100" value="10" step="1" oninput="onSkinSlide(this.value)"/>
          <div class="skin-swatch" id="skinSwatch"></div>
        </div>
      </div>

      <div>
        <div class="ctrl-label">Saved Looks</div>
        <div class="looks-grid">
          <div>
            <div class="look-slot" id="lk0" onclick="loadLook(0)"></div>
            <div class="look-lbl">Look 1</div>
          </div>
          <div>
            <div class="look-slot" id="lk1" onclick="loadLook(1)"></div>
            <div class="look-lbl">Look 2</div>
          </div>
          <div>
            <div class="look-slot" id="lk2" onclick="loadLook(2)"></div>
            <div class="look-lbl">Look 3</div>
          </div>
        </div>
      </div>

      <div class="btn-bar">
        <button class="wbtn fun" onclick="randomize()">✦ Surprise!</button>
        <button class="wbtn" onclick="openSaveModal()">Save Look</button>
      </div>
      <button class="wbtn primary" onclick="confirmAvatar()" style="width:100%;padding:6px;">
        ✓ Use This Avatar
      </button>
      <p id="saveMsg" style="font-size:9px;color:#000080;text-align:center;min-height:12px;font-family:'Inter',sans-serif;"></p>
    </div>

    <div class="statusbar">
      <div class="status-cell" id="statusText">Ready</div>
      <div class="status-cell" style="flex:0;white-space:nowrap;">Chumchi v1.0</div>
    </div>
  </div>

</div>

<!-- Save dialog -->
<div class="modal-bg" id="saveModal">
  <div class="win-dialog">
    <div class="win-dialog-title">
      <span>💾 Save Look</span>
      <div class="win-btn close" onclick="closeSaveModal()">✕</div>
    </div>
    <div class="win-dialog-body">Save current look to which slot?</div>
    <div class="win-dialog-btns">
      <button class="wbtn" onclick="saveLook(0)">Look 1</button>
      <button class="wbtn" onclick="saveLook(1)">Look 2</button>
      <button class="wbtn" onclick="saveLook(2)">Look 3</button>
    </div>
    <div class="win-dialog-btns" style="padding-top:0;">
      <button class="wbtn" onclick="closeSaveModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="../assets/supabase.js"></script>
<script src="../assets/app.js"></script>
<script>
if (sessionStorage.getItem('chumchi_site') !== 'true') window.location.href = '../index.html';
const sess = JSON.parse(sessionStorage.getItem('chumchi_session') || 'null');
if (!sess) window.location.href = '../platform/login.html';
function skipAvatar(){ sessionStorage.setItem('chumchi_avatar_skipped','true'); window.location.href='tree.html'; }

// ── SKIN PALETTE — human + fantasy ──
const SKINS = [
  '#FDEBD8','#F5CBA7','#E8B48A','#D4956A','#C07850',
  '#A0623A','#7A4020','#4A2010','#2C1008',
  '#A0C8FF','#60A0E8','#4060D0',
  '#A0E8A0','#50C850','#208820',
  '#D0A0FF','#A060E0','#6020B0',
  '#FFB0D8','#F060A0','#C02060',
  '#FFE080','#F0B820','#C08010',
  '#80F0E8','#20C8C0','#008880',
];
function skinFromSlider(v){ return SKINS[Math.round(v/100*(SKINS.length-1))]; }
let currentSkin = SKINS[2];
function onSkinSlide(v){
  currentSkin = skinFromSlider(v);
  document.getElementById('skinSwatch').style.background = currentSkin;
  setStatus('Skin: ' + currentSkin);
  drawAll();
}
function setStatus(msg){ const s=document.getElementById('statusText'); if(s) s.textContent=msg; }

// ── STATE ──
let S = { head:0, eyes:0, brows:0, mouth:0, nose:4, ears:0, hair:1, hat:-1, top:0, bottom:0, onepiece:-1, sticker:-1 };
let savedLooks = [null,null,null];

// ─────────────────────────────────────────────────────
// DRAWING — Style mix: organic curves + flat bold fills
// ─────────────────────────────────────────────────────
function cl(ctx,w,h){ ctx.clearRect(0,0,w,h); }

// Smooth rounded shape helper
function pill(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.stroke(); }
}

// HEAD — organic shapes with subtle gradient depth
function drawHead(ctx,s,i,skin){
  ctx.fillStyle = skin;
  // Subtle depth gradient
  const g = ctx.createRadialGradient(s*.42,s*.35,s*.04,s*.5,s*.5,s*.45);
  g.addColorStop(0, lighten(skin,0.18));
  g.addColorStop(1, darken(skin,0.08));
  ctx.fillStyle = g;
  ctx.beginPath();
  if(i===0){ ctx.arc(s*.5,s*.5,s*.43,0,Math.PI*2); }
  else if(i===1){ ctx.roundRect(s*.1,s*.12,s*.8,s*.74,s*.12); }
  else if(i===2){ ctx.ellipse(s*.5,s*.52,s*.37,s*.44,0,0,Math.PI*2); }
  else if(i===3){ // Hex
    const pts=[[.5,.06],[.91,.28],[.91,.72],[.5,.94],[.09,.72],[.09,.28]];
    ctx.moveTo(s*pts[0][0],s*pts[0][1]);
    pts.slice(1).forEach(p=>ctx.lineTo(s*p[0],s*p[1]));
    ctx.closePath();
  }
  else if(i===4){ ctx.roundRect(s*.08,s*.16,s*.84,s*.7,s*.06); } // robot
  ctx.fill();
  // Edge stroke
  ctx.strokeStyle = darken(skin,0.18); ctx.lineWidth=1.2; ctx.stroke();
}

function lighten(hex,amt){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+amt*255)},${Math.min(255,g+amt*255)},${Math.min(255,b+amt*255)})`;
}
function darken(hex,amt){
  if(!hex||hex[0]!=='#') return hex;
  const r=parseInt(hex.slice(1,3),16)||0, g=parseInt(hex.slice(3,5),16)||0, b=parseInt(hex.slice(5,7),16)||0;
  return `rgb(${Math.max(0,r-amt*255)},${Math.max(0,g-amt*255)},${Math.max(0,b-amt*255)})`;
}

// EARS
function drawEars(ctx,s,i,skin){
  if(i===4) return;
  const earFill = darken(skin,0.04);
  [[s*.06,s*.46],[s*.94,s*.46]].forEach(([x,y])=>{
    ctx.fillStyle = earFill;
    ctx.beginPath();
    if(i===0){ ctx.ellipse(x,y,s*.055,s*.1,0,0,Math.PI*2); }
    else if(i===1){ ctx.arc(x,y,s*.08,0,Math.PI*2); }
    else if(i===2){ // pointy
      const d=x<s*.5?1:-1;
      ctx.moveTo(x,y-s*.14);ctx.lineTo(x+d*s*.1,y+s*.08);ctx.lineTo(x,y+s*.06);ctx.closePath();
    }
    else if(i===3){ ctx.roundRect(x-s*.04,y-s*.1,s*.08,s*.22,3); }
    ctx.fill();
    ctx.strokeStyle=darken(skin,0.16); ctx.lineWidth=1; ctx.stroke();
    // inner
    ctx.fillStyle='rgba(0,0,0,0.07)';
    ctx.beginPath(); ctx.ellipse(x,y,s*.025,s*.055,0,0,Math.PI*2); ctx.fill();
  });
}

// EYES — illustrated mix: organic + expressive
function drawEyes(ctx,s,i){
  const EX=[s*.32,s*.68], EY=s*.44;
  EX.forEach(x=>{
    if(i===0){ // big round illustrated
      ctx.fillStyle='#1A0820'; ctx.beginPath(); ctx.arc(x,EY,s*.09,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#3A2850'; ctx.beginPath(); ctx.arc(x,EY,s*.075,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(x-s*.028,EY-s*.028,s*.034,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+s*.028,EY+s*.02,s*.016,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(0,160,255,0.35)'; ctx.beginPath(); ctx.arc(x,EY,s*.044,0,Math.PI*2); ctx.fill();
    }
    else if(i===1){ // rounded square
      ctx.fillStyle='#1A0820'; pill(ctx,x-s*.08,EY-s*.075,s*.16,s*.15,s*.04,'#1A0820',null);
      ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(x-s*.03,EY-s*.03,s*.035,0,Math.PI*2); ctx.fill();
    }
    else if(i===2){ // wide oval
      ctx.fillStyle='#1A0820'; ctx.beginPath(); ctx.ellipse(x,EY,s*.1,s*.065,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(x-s*.03,EY-s*.02,s*.03,0,Math.PI*2); ctx.fill();
    }
    else if(i===3){ // chibi huge
      ctx.fillStyle='#1A0820'; ctx.beginPath(); ctx.ellipse(x,EY+s*.01,s*.1,s*.12,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#3A3090'; ctx.beginPath(); ctx.ellipse(x,EY,s*.08,s*.095,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(x-s*.035,EY-s*.04,s*.04,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+s*.03,EY+s*.03,s*.018,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(0,180,255,0.4)'; ctx.beginPath(); ctx.ellipse(x,EY+s*.01,s*.06,s*.07,0,0,Math.PI*2); ctx.fill();
    }
    else if(i===4){ // sleepy half
      ctx.fillStyle='#1A0820'; ctx.beginPath(); ctx.arc(x,EY+s*.02,s*.08,Math.PI,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#1A0820'; ctx.lineWidth=s*.018; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x-s*.09,EY+s*.02); ctx.lineTo(x+s*.09,EY+s*.02); ctx.stroke();
    }
    else if(i===5){ // star
      ctx.fillStyle='#FFD700';
      for(let p=0;p<5;p++){
        const a=p*Math.PI*.4-Math.PI*.5, a2=a+Math.PI*.2;
        ctx.beginPath(); ctx.moveTo(x,EY);
        ctx.lineTo(x+Math.cos(a)*s*.09,EY+Math.sin(a)*s*.09);
        ctx.lineTo(x+Math.cos(a2)*s*.04,EY+Math.sin(a2)*s*.04);
        ctx.closePath(); ctx.fill();
      }
    }
    else if(i===6){ // heart
      ctx.fillStyle='#FF4488'; ctx.beginPath();
      ctx.moveTo(x,EY+s*.05);
      ctx.bezierCurveTo(x,EY,x-s*.08,EY-s*.06,x-s*.08,EY);
      ctx.bezierCurveTo(x-s*.08,EY+s*.04,x,EY+s*.08,x,EY+s*.05);
      ctx.bezierCurveTo(x,EY+s*.08,x+s*.08,EY+s*.04,x+s*.08,EY);
      ctx.bezierCurveTo(x+s*.08,EY-s*.06,x,EY,x,EY+s*.05);
      ctx.fill();
    }
    else if(i===7){ // teardrop
      ctx.fillStyle='#1A0820'; ctx.beginPath(); ctx.ellipse(x,EY+s*.02,s*.065,s*.1,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(x-s*.02,EY-s*.03,s*.028,0,Math.PI*2); ctx.fill();
    }
    else if(i===8){ // spiral
      ctx.strokeStyle='#8040C0'; ctx.lineWidth=s*.022; ctx.lineCap='round';
      ctx.beginPath();
      for(let t=0.2;t<5.5;t+=0.08){
        const r=t*s*.013; const px=x+Math.cos(t*2)*r; const py=EY+Math.sin(t*2)*r;
        t<0.3?ctx.moveTo(px,py):ctx.lineTo(px,py);
      } ctx.stroke();
    }
    else if(i===9){ // X
      ctx.strokeStyle='#FF2060'; ctx.lineWidth=s*.035; ctx.lineCap='round';
      const r=s*.07;
      ctx.beginPath(); ctx.moveTo(x-r,EY-r); ctx.lineTo(x+r,EY+r); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+r,EY-r); ctx.lineTo(x-r,EY+r); ctx.stroke();
    }
  });
  // Blink highlight line over eyes for style 1/3
  if(i===0||i===3){
    EX.forEach(x=>{
      ctx.fillStyle='rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.ellipse(x,EY-s*.04,s*.06,s*.02,0,0,Math.PI*2); ctx.fill();
    });
  }
}

// BROWS
function drawBrows(ctx,s,i){
  ctx.lineCap='round'; ctx.lineJoin='round';
  const col='rgba(60,30,10,0.75)';
  [[s*.22,s*.32,s*.42,s*.28],[s*.58,s*.28,s*.78,s*.32]].forEach(([x1,y1,x2,y2])=>{
    ctx.strokeStyle=col; ctx.lineWidth=i===2?s*.038:i===4?s*.03:s*.024;
    ctx.beginPath();
    if(i===0){ ctx.moveTo(x1,y1); ctx.quadraticCurveTo((x1+x2)/2,(y1+y2)/2-s*.05,x2,y2); }
    else if(i===1){ ctx.moveTo(x1,(y1+y2)/2); ctx.lineTo(x2,(y1+y2)/2); }
    else if(i===2){ ctx.moveTo(x1,y1); ctx.quadraticCurveTo((x1+x2)/2,y1-s*.04,x2,y2); }
    else if(i===3){ ctx.moveTo(x1,y2+s*.04); ctx.quadraticCurveTo((x1+x2)/2,y1-s*.02,x2,y2+s*.04); }
    else if(i===4){ const mx=(x1+x2)/2; ctx.moveTo(x1,y1-s*.02); ctx.lineTo(mx,y2+s*.03); ctx.lineTo(x2,y1-s*.02); }
    ctx.stroke();
  });
}

// NOSE — subtle, organic
function drawNose(ctx,s,i){
  if(i===4) return;
  ctx.strokeStyle='rgba(80,40,10,0.2)'; ctx.fillStyle='rgba(80,40,10,0.06)';
  ctx.lineWidth=s*.016; ctx.lineCap='round';
  if(i===0){
    ctx.beginPath(); ctx.moveTo(s*.5,s*.54); ctx.lineTo(s*.44,s*.64);
    ctx.quadraticCurveTo(s*.5,s*.67,s*.56,s*.64); ctx.stroke();
  } else if(i===1){
    ctx.beginPath(); ctx.arc(s*.5,s*.61,s*.03,0,Math.PI*2); ctx.fill();
  } else if(i===2){
    ctx.beginPath(); ctx.moveTo(s*.42,s*.63); ctx.quadraticCurveTo(s*.5,s*.59,s*.58,s*.63); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(s*.44,s*.635,s*.04,s*.028,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*.56,s*.635,s*.04,s*.028,0,0,Math.PI*2); ctx.fill();
  } else if(i===3){
    [[s*.46,s*.55,s*.46,s*.64],[s*.54,s*.55,s*.54,s*.64]].forEach(([x1,y1,x2,y2])=>{
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    });
  }
}

// MOUTHS — all canvas, no text
function drawMouth(ctx,s,i){
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(i===0){ // classic smile
    ctx.strokeStyle='#5C1A1A'; ctx.lineWidth=s*.028;
    ctx.beginPath(); ctx.moveTo(s*.3,s*.71); ctx.quadraticCurveTo(s*.5,s*.83,s*.7,s*.71); ctx.stroke();
    // lip highlight
    ctx.fillStyle='rgba(255,180,160,0.15)';
    ctx.beginPath(); ctx.moveTo(s*.3,s*.71); ctx.quadraticCurveTo(s*.5,s*.83,s*.7,s*.71);
    ctx.quadraticCurveTo(s*.5,s*.77,s*.3,s*.71); ctx.fill();
  } else if(i===1){ // big grin
    ctx.fillStyle='#1A0A10'; ctx.beginPath();
    ctx.moveTo(s*.27,s*.69); ctx.quadraticCurveTo(s*.5,s*.86,s*.73,s*.69); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#FFF'; ctx.fillRect(s*.32,s*.695,s*.36,s*.09);
    for(let j=0;j<4;j++){ ctx.strokeStyle='rgba(0,0,0,0.1)'; ctx.lineWidth=s*.006; ctx.beginPath(); ctx.moveTo(s*.36+j*s*.08,s*.695); ctx.lineTo(s*.36+j*s*.08,s*.785); ctx.stroke(); }
  } else if(i===2){ // flat
    ctx.strokeStyle='#5C1A1A'; ctx.lineWidth=s*.028;
    ctx.beginPath(); ctx.moveTo(s*.33,s*.73); ctx.lineTo(s*.67,s*.73); ctx.stroke();
  } else if(i===3){ // frown
    ctx.strokeStyle='#5C1A1A'; ctx.lineWidth=s*.028;
    ctx.beginPath(); ctx.moveTo(s*.3,s*.77); ctx.quadraticCurveTo(s*.5,s*.66,s*.7,s*.77); ctx.stroke();
  } else if(i===4){ // smirk
    ctx.strokeStyle='#5C1A1A'; ctx.lineWidth=s*.026;
    ctx.beginPath(); ctx.moveTo(s*.35,s*.74); ctx.quadraticCurveTo(s*.47,s*.81,s*.65,s*.7); ctx.stroke();
  } else if(i===5){ // open O
    ctx.fillStyle='#1A0A10'; ctx.beginPath(); ctx.ellipse(s*.5,s*.73,s*.09,s*.07,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5A2020'; ctx.beginPath(); ctx.ellipse(s*.5,s*.73,s*.06,s*.045,0,0,Math.PI*2); ctx.fill();
  } else if(i===6){ // teeth
    ctx.fillStyle='#1A0A10'; ctx.beginPath();
    ctx.moveTo(s*.3,s*.69); ctx.quadraticCurveTo(s*.5,s*.82,s*.7,s*.69); ctx.closePath(); ctx.fill();
    for(let j=0;j<4;j++){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.roundRect(s*.33+j*s*.09,s*.695,s*.08,s*.07,2); ctx.fill(); }
  } else if(i===7){ // tongue
    ctx.fillStyle='#1A0A10'; ctx.beginPath();
    ctx.moveTo(s*.3,s*.69); ctx.quadraticCurveTo(s*.5,s*.82,s*.7,s*.69); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#FF6B9D'; ctx.beginPath(); ctx.ellipse(s*.5,s*.8,s*.09,s*.065,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.1)'; ctx.lineWidth=s*.008; ctx.beginPath(); ctx.moveTo(s*.5,s*.74); ctx.lineTo(s*.5,s*.87); ctx.stroke();
  } else if(i===8){ // cat
    ctx.strokeStyle='#5C1A1A'; ctx.lineWidth=s*.024;
    ctx.beginPath(); ctx.moveTo(s*.43,s*.73); ctx.lineTo(s*.5,s*.71); ctx.lineTo(s*.57,s*.73); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*.35,s*.71); ctx.quadraticCurveTo(s*.43,s*.78,s*.43,s*.73); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*.65,s*.71); ctx.quadraticCurveTo(s*.57,s*.78,s*.57,s*.73); ctx.stroke();
  } else if(i===9){ // kiss
    ctx.fillStyle='#FF4488'; ctx.beginPath(); ctx.ellipse(s*.5,s*.72,s*.032,s*.052,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FFB0D0'; ctx.beginPath(); ctx.arc(s*.42,s*.7,s*.02,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*.58,s*.7,s*.02,0,Math.PI*2); ctx.fill();
  }
  // Blush cheeks for chibi modes
  if(i===0||i===1||i===6){
    ctx.fillStyle='rgba(255,140,120,0.18)';
    ctx.beginPath(); ctx.ellipse(s*.22,s*.62,s*.06,s*.04,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*.78,s*.62,s*.06,s*.04,0,0,Math.PI*2); ctx.fill();
  }
}

// HAIR — flat bold fills with shine
function drawHair(ctx,s,i,skin){
  if(i===0) return;
  const COLS=['','#3C1A08','#2C1808','#8B4513','#1A1A1A','#D4A030','#8B0808','#6A0DAD','#0040C0','#00AAAA','#FF69B4','#EEEAF8','#F5F5F5'];
  const col=i<COLS.length?COLS[i]:'#3C1A08';
  ctx.fillStyle=col;
  // Base cap
  if(i!==4&&i!==13){
    ctx.beginPath(); ctx.arc(s*.5,s*.5,s*.42,Math.PI,0); ctx.fill();
    // Shine
    const g=ctx.createLinearGradient(s*.28,s*.2,s*.5,s*.38);
    g.addColorStop(0,'rgba(255,255,255,0.22)'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(s*.38,s*.3,s*.12,s*.08,-0.5,0,Math.PI*2); ctx.fill();
  }
  // Long styles get side panels
  if(i===2||i===3){
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.roundRect(s*.06,s*.46,s*.1,s*.5,5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(s*.84,s*.46,s*.1,s*.5,5); ctx.fill();
  }
  // Curly
  if(i===4){
    for(let j=0;j<8;j++){ const a=j/8*Math.PI; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(s*.5+Math.cos(a+Math.PI)*s*.36,s*.5+Math.sin(a+Math.PI)*s*.36,s*.11,0,Math.PI*2); ctx.fill(); }
  }
  // Mohawk (index 13 doesn't exist here but handle overflow)
}

    ctx.fillStyle='#FFD700'; ctx.fillRect(0,0,w,h*.1); ctx.fillRect(0,h*.9,w,h*.1);
    ctx.strokeStyle='#FFD700'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(w*.25,h*.1); ctx.quadraticCurveTo(w*.18,h*.5,w*.3,h*.9); ctx.stroke();
  },
  (ctx,w,h)=>{ // chef robe
    ctx.fillStyle='#F0F0F0'; ctx.beginPath(); ctx.roundRect(0,0,w,h,8); ctx.fill();
    ctx.fillStyle='#E0E0E0'; ctx.fillRect(w*.44,0,w*.12,h);
    for(let i=0;i<4;i++){ ctx.fillStyle='#CCC'; ctx.beginPath(); ctx.arc(w*.5,h*.1+i*h*.2,w*.028,0,Math.PI*2); ctx.fill(); }
    ctx.strokeStyle='#D0D0D0'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,h); ctx.stroke(); ctx.beginPath(); ctx.moveTo(w,0); ctx.lineTo(w,h); ctx.stroke();
  },
  (ctx,w,h)=>{ // wizard robe
    const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'#1A0A40'); g.addColorStop(1,'#3A1A80');
    ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(0,0,w,h,8); ctx.fill();
    ctx.fillStyle='#FFD700';
    [[w*.25,h*.22],[w*.72,h*.32],[w*.38,h*.58],[w*.7,h*.66],[w*.3,h*.8]].forEach(([x,y])=>{
      for(let p=0;p<5;p++){ const a=p/5*Math.PI*2; ctx.beginPath(); ctx.lineTo(x+Math.cos(a-Math.PI*.5)*w*.04,y+Math.sin(a-Math.PI*.5)*h*.04); }
      ctx.beginPath(); ctx.arc(x,y,w*.028,0,Math.PI*2); ctx.fill();
    });
  },
  (ctx,w,h)=>{ // hotdog
    ctx.fillStyle='#D4845A'; ctx.beginPath(); ctx.ellipse(w*.5,h*.44,w*.42,h*.48,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#E8A070'; ctx.beginPath(); ctx.roundRect(w*.05,h*.28,w*.9,h*.32,w*.45); ctx.fill();
    ctx.strokeStyle='#FFD700'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    for(let i=0;i<6;i++){ ctx.lineTo(w*(.12+i*.15),i%2===0?h*.36:h*.52); } ctx.stroke();
  },
  (ctx,w,h,skin)=>{ // apron
    ctx.fillStyle=skin; ctx.beginPath(); ctx.roundRect(0,0,w,h,6); ctx.fill();
    ctx.fillStyle='#C8D8C0'; ctx.beginPath(); ctx.moveTo(w*.26,h*.08); ctx.lineTo(w*.74,h*.08); ctx.lineTo(w*.8,h); ctx.lineTo(w*.2,h); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.roundRect(w*.36,h*.24,w*.28,h*.22,6); ctx.fill();
    ctx.strokeStyle='#A8C8A0'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(w*.36,h*.08); ctx.quadraticCurveTo(w*.2,h*.02,w*.16,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w*.64,h*.08); ctx.quadraticCurveTo(w*.8,h*.02,w*.84,0); ctx.stroke();
  },
];

// STICKERS
const STICKERS=[
  null,
  (ctx,s)=>{ ctx.fillStyle='#8B5A2B'; ctx.beginPath(); ctx.ellipse(s*.5,s*.22,s*.14,s*.1,0,0,Math.PI*2); ctx.fill(); ctx.fillRect(s*.47,s*.3,s*.06,s*.52); },
  (ctx,s)=>{ ctx.strokeStyle='#999'; ctx.lineWidth=s*.035; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(s*.5,s*.52); ctx.lineTo(s*.5,s*.86); ctx.stroke(); for(let i=0;i<4;i++){ const a=i/4*Math.PI*2; ctx.lineWidth=s*.022; ctx.beginPath(); ctx.moveTo(s*.5,s*.5); ctx.bezierCurveTo(s*.5+Math.cos(a)*s*.2,s*.5+Math.sin(a)*s*.2,s*.5+Math.cos(a)*s*.18,s*.5+Math.sin(a)*s*.1,s*.5,s*.5); ctx.stroke(); } },
  (ctx,s)=>{ ctx.fillStyle='#CC1100'; ctx.beginPath(); ctx.moveTo(s*.5,s*.12); ctx.bezierCurveTo(s*.72,s*.2,s*.74,s*.52,s*.5,s*.82); ctx.bezierCurveTo(s*.26,s*.52,s*.28,s*.2,s*.5,s*.12); ctx.fill(); ctx.fillStyle='#228B22'; ctx.fillRect(s*.47,s*.06,s*.06,s*.1); },
  (ctx,s)=>{ ctx.fillStyle='#C4A050'; ctx.beginPath(); ctx.moveTo(s*.3,s*.25); ctx.lineTo(s*.7,s*.25); ctx.lineTo(s*.65,s*.72); ctx.lineTo(s*.35,s*.72); ctx.closePath(); ctx.fill(); ctx.fillStyle='#8B4513'; ctx.beginPath(); ctx.ellipse(s*.5,s*.5,s*.2,s*.12,0,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#C4A050'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(s*.72,s*.45,s*.09,0,Math.PI*2); ctx.stroke(); },
  (ctx,s)=>{ ctx.fillStyle='#D4A060'; ctx.beginPath(); ctx.roundRect(s*.12,s*.42,s*.76,s*.16,8); ctx.fill(); ctx.fillStyle='#B88040'; ctx.beginPath(); ctx.arc(s*.14,s*.5,s*.11,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(s*.86,s*.5,s*.11,0,Math.PI*2); ctx.fill(); },
  (ctx,s)=>{ ctx.fillStyle='#AAA'; ctx.beginPath(); ctx.roundRect(s*.44,s*.1,s*.12,s*.48,4); ctx.fill(); ctx.beginPath(); ctx.roundRect(s*.34,s*.56,s*.32,s*.16,s*.06); ctx.fill(); },
  (ctx,s)=>{ ctx.strokeStyle='#888'; ctx.lineWidth=s*.04; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(s*.37,s*.16); ctx.lineTo(s*.37,s*.72); ctx.stroke(); ctx.beginPath(); ctx.moveTo(s*.63,s*.16); ctx.lineTo(s*.63,s*.72); ctx.stroke(); ctx.beginPath(); ctx.arc(s*.5,s*.16,s*.13,0,Math.PI); ctx.stroke(); },
  (ctx,s)=>{ ctx.fillStyle='#E8C870'; ctx.strokeStyle='#C4A040'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.roundRect(s*.2,s*.38,s*.6,s*.48,s*.06); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(s*.5,s*.37,s*.32,s*.06,0,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(s*.16,s*.5,s*.06,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(s*.84,s*.5,s*.06,0,Math.PI*2); ctx.fill(); },
  (ctx,s)=>{ ctx.fillStyle='#E8C87A'; ctx.beginPath(); ctx.ellipse(s*.5,s*.5,s*.3,s*.42,0.3,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#C4A050'; ctx.globalAlpha=0.4; for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(s*(.35+i*.1),s*(.35+i*.08),s*.06,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; },
];

// ── MAIN DRAW ──
function drawFace(ctx, s, cfg){
  cl(ctx,s,s);
  const skin = cfg.skin||currentSkin;
  drawHair(ctx,s,cfg.hair,skin);
  drawEars(ctx,s,cfg.ears,skin);
  drawHead(ctx,s,cfg.head,skin);
  drawHat(ctx,s,cfg.hat);
  drawBrows(ctx,s,cfg.brows);
  drawEyes(ctx,s,cfg.eyes);
  drawNose(ctx,s,cfg.nose);
  drawMouth(ctx,s,cfg.mouth);
  if(cfg.sticker>=0&&STICKERS[cfg.sticker+1]){
    ctx.save(); ctx.translate(s*.68,s*.04); ctx.scale(0.26,0.26);
    STICKERS[cfg.sticker+1](ctx,s); ctx.restore();
  }
}

function drawBody(ctx,w,h,cfg){
  cl(ctx,w,h);
  const skin=cfg.skin||currentSkin;
  // Head (top 38%)
  ctx.save(); ctx.translate(w*.08,0); ctx.scale(0.84,0.84); drawFace(ctx,w,cfg); ctx.restore();
  const fbot=h*.35, neckH=h*.055;
  // Neck
  ctx.fillStyle=skin; ctx.beginPath(); ctx.roundRect(w*.4,fbot,w*.2,neckH,3); ctx.fill();
  const tTop=fbot+neckH, bW=w*.64, bX=w*.18, tH=h*.28;
  // Arms
  ctx.fillStyle=skin;
  ctx.beginPath(); ctx.roundRect(bX-w*.1,tTop+tH*.05,w*.11,tH*.7,10); ctx.fill();
  ctx.beginPath(); ctx.roundRect(bX+bW-w*.01,tTop+tH*.05,w*.11,tH*.7,10); ctx.fill();
  // Hands
  ctx.beginPath(); ctx.arc(bX-w*.05,tTop+tH*.76,w*.07,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(bX+bW+w*.06,tTop+tH*.76,w*.07,0,Math.PI*2); ctx.fill();
  // Body
  if(cfg.onepiece>=0&&ONEPIECES[cfg.onepiece]){
    ctx.save(); ctx.translate(bX,tTop); ONEPIECES[cfg.onepiece](ctx,bW,h*.6,skin); ctx.restore();
  } else {
    const tf=TOPS[cfg.top%TOPS.length];
    if(tf){ ctx.save(); ctx.translate(bX,tTop); tf(ctx,bW,tH,skin); ctx.restore(); }
    const bf=BOTTOMS[cfg.bottom%BOTTOMS.length];
    const legTop=tTop+tH-4, legH=h*.25;
    if(bf){ ctx.save(); ctx.translate(bX,legTop); bf(ctx,bW,legH,skin); ctx.restore(); }
  }
  // Feet
  ctx.fillStyle=skin;
  ctx.beginPath(); ctx.ellipse(bX+bW*.22,h*.9,w*.1,h*.03,0.1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bX+bW*.78,h*.9,w*.1,h*.03,-0.1,0,Math.PI*2); ctx.fill();
  // Sticker in hand
  if(cfg.sticker>=0&&STICKERS[cfg.sticker+1]){
    ctx.save(); ctx.translate(bX+bW+w*.08-14,tTop+tH*.52);
    ctx.scale(0.36,0.36); STICKERS[cfg.sticker+1](ctx,80); ctx.restore();
  }
}

function drawAll(){
  S.skin=currentSkin;
  drawFace(document.getElementById('faceCanvas').getContext('2d'),200,S);
  drawBody(document.getElementById('bodyCanvas').getContext('2d'),180,280,S);
  refreshLooks();
}

// ── VIEW ──
function setView(v,btn){
  document.getElementById('faceCanvas').style.display=v==='face'?'block':'none';
  document.getElementById('bodyCanvas').style.display=v==='body'?'block':'none';
  document.querySelectorAll('.vtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ── TRAIT DEFS ──
const TDEFS=[
  {key:'head',   label:'Head Shape', cols:5, names:['Round','Square-ish','Oval','Hex','Robot'], opt:false},
  {key:'eyes',   label:'Eyes',       cols:5, names:['Big Round','Square','Wide','Chibi','Sleepy','Star','Heart','Teardrop','Spiral','× Eyes'], opt:false},
  {key:'brows',  label:'Eyebrows',   cols:5, names:['Arched','Flat','Thick Arch','Raised','Angry'], opt:false},
  {key:'mouth',  label:'Mouth',      cols:5, names:['Smile','Grin','Flat','Frown','Smirk','Open O','Teeth','Tongue','Cat :3','Kiss'], opt:false},
  {key:'nose',   label:'Nose',       cols:5, names:['Simple','Button','Wide','Lines','None'], opt:false},
  {key:'ears',   label:'Ears',       cols:5, names:['Oval','Round','Pointy','Robot Tab','None'], opt:false},
  {key:'hair',   label:'Hair',       cols:6, names:['Bald','Dark Brown','Long Brown','Wavy Auburn','Curly Black','Blonde','Dark Red','Purple','Blue','Teal','Pink','Silver','White'], opt:false},
  {key:'hat',    label:'Hats',       cols:5, names:['None','Chef Toque','Sushi Band','Baker Cap','Party Hat','Cowboy','Beret','Bandana','Pot Head'], opt:true},
  {key:'top',    label:'Tops',       cols:5, names:['T-Shirt','Chef White','Kurta','Hoodie','Tank Top'], opt:false},
  {key:'bottom', label:'Bottoms',    cols:5, names:['Jeans','Skirt','Shorts','Joggers','Wide Leg'], opt:false},
  {key:'onepiece',label:'One-Pieces',cols:5, names:['None','Sari','Chef Robe','Wizard Robe','Hotdog!','Apron'], opt:true},
  {key:'sticker',label:'Accessories',cols:5, names:['None','Spoon','Whisk','Chili','Chai Cup','Rolling Pin','Spatula','Tongs','Curry Pot','Naan'], opt:true},
];

function renderThumb(c,def,nIdx,sv){
  const ctx=c.getContext('2d'); const s=c.width;
  ctx.clearRect(0,0,s,s);
  const sk='#E8B48A';
  try{
    if(def.key==='head')     drawHead(ctx,s,nIdx,sk);
    else if(def.key==='eyes')    { drawHead(ctx,s,1,sk); drawEyes(ctx,s,nIdx); }
    else if(def.key==='brows')   { drawBrows(ctx,s,nIdx); }
    else if(def.key==='mouth')   { drawMouth(ctx,s,nIdx); }
    else if(def.key==='nose')    { drawNose(ctx,s,nIdx); }
    else if(def.key==='ears')    { drawEars(ctx,s,nIdx,sk); }
    else if(def.key==='hair')    { if(nIdx>0){ drawHead(ctx,s,0,sk); drawHair(ctx,s,nIdx,sk); } }
    else if(def.key==='hat')     { if(sv>=0&&HATS[sv+1]){ drawHead(ctx,s,0,sk); HATS[sv+1](ctx,s); } }
    else if(def.key==='top')     { if(TOPS[nIdx]) TOPS[nIdx](ctx,s,s,sk); }
    else if(def.key==='bottom')  { if(BOTTOMS[nIdx]) BOTTOMS[nIdx](ctx,s,s); }
    else if(def.key==='onepiece'){ if(sv>=0&&ONEPIECES[sv]) ONEPIECES[sv](ctx,s,s,sk); }
    else if(def.key==='sticker') { if(sv>=0&&STICKERS[sv+1]) STICKERS[sv+1](ctx,s); }
  }catch(e){}
}

function buildUI(){
  const toolbar=document.getElementById('catToolbar');
  const container=document.getElementById('traitsContainer');
  TDEFS.forEach(def=>{
    // Toolbar button
    const btn=document.createElement('button');
    btn.className='cat-btn'; btn.textContent=def.label;
    btn.onclick=()=>{
      document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('sec-'+def.key)?.scrollIntoView({behavior:'smooth',block:'start'});
    };
    toolbar.appendChild(btn);
    // Section
    const sec=document.createElement('div');
    sec.className='tsec'; sec.id='sec-'+def.key;
    const head=document.createElement('div');
    head.className='tsec-head'; head.textContent=def.label;
    let open=true;
    head.onclick=()=>{ open=!open; head.classList.toggle('closed',!open); grid.classList.toggle('hidden',!open); };
    sec.appendChild(head);
    const grid=document.createElement('div');
    grid.className='tgrid';
    grid.style.gridTemplateColumns=`repeat(${def.cols},1fr)`;
    def.names.forEach((name,nIdx)=>{
      const sv=def.opt?nIdx-1:nIdx;
      const tile=document.createElement('div');
      tile.className='ttile'+(S[def.key]===sv?' sel':'');
      tile.dataset.trait=def.key; tile.dataset.val=sv;
      tile.title=name;
      tile.onclick=()=>{ S[def.key]=sv; syncT(def.key); drawAll(); setStatus(def.label+': '+name); };
      if(name==='None'||name==='Bald'){
        tile.innerHTML=`<span class="ttile-none">${name}</span>`;
      } else {
        const c=document.createElement('canvas'); c.width=40; c.height=40;
        c.style.cssText='width:100%;height:auto;display:block;';
        renderThumb(c,def,nIdx,sv);
        tile.appendChild(c);
        const lbl=document.createElement('div'); lbl.className='ttile-lbl'; lbl.textContent=name;
        tile.appendChild(lbl);
      }
      grid.appendChild(tile);
    });
    sec.appendChild(grid);
    container.appendChild(sec);
  });
}

function syncT(key){
  document.querySelectorAll(`[data-trait="${key}"]`).forEach(t=>{
    t.classList.toggle('sel',parseInt(t.dataset.val)===S[key]);
  });
}
function syncAll(){ TDEFS.forEach(d=>syncT(d.key)); }

function r(n){ return Math.floor(Math.random()*n); }
function randomize(){
  S.head=r(5); S.eyes=r(10); S.brows=r(5); S.mouth=r(10);
  S.nose=r(5); S.ears=r(5);
  S.hair=Math.random()>.1?r(12)+1:0;
  S.hat=Math.random()>.55?r(8):-1;
  S.top=r(5); S.bottom=r(5);
  S.onepiece=Math.random()>.72?r(5):-1;
  S.sticker=Math.random()>.5?r(9):-1;
  const sv=Math.floor(Math.random()*100);
  currentSkin=skinFromSlider(sv); S.skin=currentSkin;
  document.getElementById('skinSlider').value=sv;
  document.getElementById('skinSwatch').style.background=currentSkin;
  drawAll(); syncAll(); setStatus('Randomized!');
}

function openSaveModal(){ document.getElementById('saveModal').classList.add('open'); }
function closeSaveModal(){ document.getElementById('saveModal').classList.remove('open'); }

function saveLook(slot){
  savedLooks[slot]=JSON.parse(JSON.stringify({...S,skin:currentSkin}));
  updateSlot(slot); closeSaveModal();
  document.getElementById('saveMsg').textContent=`Look ${slot+1} saved.`;
  setTimeout(()=>{ document.getElementById('saveMsg').textContent=''; },2000);
  localStorage.setItem('chumchi_looks',JSON.stringify(savedLooks));
}

function updateSlot(slot){
  if(!savedLooks[slot]) return;
  const el=document.getElementById('lk'+slot);
  el.classList.add('filled'); el.innerHTML='';
  const mc=document.createElement('canvas'); mc.width=52; mc.height=52;
  mc.style.cssText='width:100%;height:100%;';
  drawFace(mc.getContext('2d'),52,savedLooks[slot]);
  el.appendChild(mc);
}

function loadLook(slot){
  if(!savedLooks[slot]) return;
  Object.assign(S,savedLooks[slot]); currentSkin=S.skin;
  const sv=Math.max(0,SKINS.indexOf(currentSkin));
  document.getElementById('skinSlider').value=sv>0?Math.round(sv/(SKINS.length-1)*100):10;
  document.getElementById('skinSwatch').style.background=currentSkin;
  drawAll(); syncAll(); setStatus('Loaded Look '+(slot+1));
}

function refreshLooks(){ savedLooks.forEach((_,i)=>{ if(savedLooks[i]) updateSlot(i); }); }

async function confirmAvatar(){
  S.skin=currentSkin;
  const btn=document.querySelector('.wbtn.primary');
  btn.textContent='Saving…'; btn.disabled=true;
  const mid=sess?.memberId;
  localStorage.setItem('chumchi_avatar_'+(mid||'guest'),JSON.stringify(S));
  sessionStorage.setItem('chumchi_avatar_set','true');
  if(mid&&typeof window.sb!=='undefined'){
    sbReady&&sbReady(async()=>{
      await window.sb.from('members').update({avatar_config:JSON.stringify(S)}).eq('username',mid);
    });
  }
  // WIN95 style: show saving in status bar
  setStatus('Saving avatar… please wait');
  const fc=document.getElementById('faceCanvas');
  const poses=['scale(1.1)','rotate(8deg)','scale(1.15) rotate(-6deg)','scale(1.2) rotate(5deg)'];
  let i=0; fc.style.transition='transform 0.22s';
  const iv=setInterval(()=>{
    fc.style.transform=poses[i%poses.length]; i++;
    if(i>7){
      clearInterval(iv);
      fc.style.transition='transform 0.35s';
      fc.style.transform='scale(0)';
      setStatus('Avatar saved! Returning to tree…');
      setTimeout(()=>window.location.href='tree.html',400);
    }
  },200);
}

// ── INIT ──
document.getElementById('skinSwatch').style.background=currentSkin;
buildUI();
drawAll();

try{
  const sv=localStorage.getItem('chumchi_looks');
  if(sv){ savedLooks=JSON.parse(sv); savedLooks.forEach((_,i)=>{ if(savedLooks[i]) updateSlot(i); }); }
}catch(e){}

const mid=sess?.memberId;
if(mid){
  const lc=localStorage.getItem('chumchi_avatar_'+mid);
  if(lc){ try{ const cfg=JSON.parse(lc); Object.assign(S,cfg); currentSkin=S.skin||currentSkin;
    const sv=Math.max(0,SKINS.indexOf(currentSkin));
    document.getElementById('skinSlider').value=sv>0?Math.round(sv/(SKINS.length-1)*100):10;
    document.getElementById('skinSwatch').style.background=currentSkin;
    drawAll(); syncAll(); setStatus('Welcome back, '+mid+'!'); }catch(e){} }
  else { setStatus('New avatar — customize yours!'); }
}
