<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chumchi — Avatar Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:     #F0EEF8;
      --card:   #FFFFFF;
      --neon1:  #00E5FF;
      --neon2:  #FF2D9B;
      --neon3:  #A259FF;
      --neon4:  #00FF94;
      --ink:    #1A0A2E;
      --soft:   #6B5E8A;
      --border: rgba(162,89,255,0.18);
      --sel:    rgba(0,229,255,0.22);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;min-height:100vh;}
    body{
      font-family:'Inter',sans-serif;
      background: linear-gradient(135deg,#E8E4F8 0%,#F5E6F8 40%,#E4F0F8 100%);
      color:var(--ink);
      min-height:100vh;
    }

    /* ── Studio chrome bar ── */
    .chrome {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0.55rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .chrome-dots { display:flex;gap:6px; }
    .dot{width:12px;height:12px;border-radius:50%;}
    .dot-r{background:#FF5F56;} .dot-a{background:#FFBD2E;} .dot-g{background:#27C93F;}
    .chrome-title {
      font-family:'Cormorant Garamond',serif;
      font-size:0.85rem;font-weight:300;letter-spacing:0.22em;
      text-transform:uppercase;color:var(--soft);
    }
    .chrome-nav { margin-left:auto;display:flex;gap:0.5rem; }
    .chrome-btn {
      font-family:'Inter',sans-serif;font-size:0.6rem;font-weight:500;
      letter-spacing:0.12em;text-transform:uppercase;padding:0.3rem 0.8rem;
      border-radius:20px;border:1.5px solid var(--border);color:var(--soft);
      background:transparent;cursor:pointer;text-decoration:none;transition:all 0.2s;
    }
    .chrome-btn:hover{background:var(--neon3);color:#fff;border-color:var(--neon3);}

    /* ── Page layout ── */
    .studio {
      max-width:1100px;
      margin:0 auto;
      padding:1.5rem 1rem 5rem;
      display:grid;
      grid-template-columns:260px 1fr;
      gap:1.2rem;
      align-items:start;
    }
    @media(max-width:700px){
      .studio{grid-template-columns:1fr;}
      .preview-pane{position:static;}
    }

    /* ── Preview pane ── */
    .preview-pane{position:sticky;top:68px;}
    .preview-card{
      background:var(--card);
      border-radius:20px;
      padding:1.4rem;
      border:1.5px solid var(--border);
      box-shadow:0 4px 24px rgba(162,89,255,0.10);
      text-align:center;
    }
    .preview-label{
      font-size:0.58rem;letter-spacing:0.22em;text-transform:uppercase;
      color:var(--soft);margin-bottom:0.8rem;display:block;font-weight:600;
    }

    /* View toggle */
    .view-toggle{
      display:inline-flex;background:#F0EEF8;border-radius:20px;
      padding:3px;margin-bottom:1rem;gap:2px;
    }
    .vtog{
      font-size:0.6rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;
      padding:0.3rem 0.85rem;border-radius:18px;border:none;cursor:pointer;
      background:transparent;color:var(--soft);transition:all 0.2s;font-family:'Inter',sans-serif;
    }
    .vtog.active{
      background:linear-gradient(135deg,var(--neon3),var(--neon1));
      color:#fff;box-shadow:0 2px 10px rgba(0,229,255,0.3);
    }

    /* Avatar canvas */
    #canvasFace{width:180px;height:180px;display:block;margin:0 auto;}
    #canvasBody{width:180px;height:260px;display:block;margin:0 auto;display:none;}

    /* Skin slider */
    .skin-row{display:flex;align-items:center;gap:0.6rem;margin:0.9rem 0 0.5rem;}
    .skin-lbl{font-size:0.58rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--soft);white-space:nowrap;}
    #skinSlider{
      flex:1;height:6px;border-radius:3px;outline:none;cursor:pointer;
      background:linear-gradient(to right,#FDEBD8,#F5CBA7,#C07850,#7A4020,#2C1008,#A0F,#0AF,#0F9);
      -webkit-appearance:none;appearance:none;
    }
    #skinSlider::-webkit-slider-thumb{
      -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
      background:#fff;border:2.5px solid var(--neon3);box-shadow:0 0 8px rgba(162,89,255,0.5);cursor:pointer;
    }
    .skin-swatch{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;}

    /* Saved looks */
    .looks-row{display:flex;gap:0.5rem;justify-content:center;margin:0.8rem 0;}
    .look-slot{
      width:52px;height:52px;border-radius:50%;
      border:2px dashed rgba(162,89,255,0.25);cursor:pointer;
      overflow:hidden;display:flex;align-items:center;justify-content:center;
      font-size:0.55rem;color:var(--soft);transition:all 0.2s;background:#F8F6FF;
    }
    .look-slot:hover{border-color:var(--neon3);}
    .look-slot.filled{border-style:solid;border-color:var(--neon1);box-shadow:0 0 10px rgba(0,229,255,0.3);}
    .look-lbl{font-size:0.52rem;color:var(--soft);letter-spacing:0.1em;text-transform:uppercase;text-align:center;margin-top:2px;}

    /* Action buttons */
    .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-top:0.8rem;}
    .abtn{
      padding:0.65rem 0.5rem;border:none;border-radius:10px;cursor:pointer;
      font-family:'Inter',sans-serif;font-size:0.6rem;font-weight:600;
      letter-spacing:0.1em;text-transform:uppercase;transition:all 0.2s;
    }
    .abtn-random{
      background:linear-gradient(135deg,var(--neon2),var(--neon3));
      color:#fff;box-shadow:0 3px 12px rgba(255,45,155,0.3);
    }
    .abtn-random:hover{transform:scale(1.03);box-shadow:0 4px 18px rgba(255,45,155,0.45);}
    .abtn-save{
      background:linear-gradient(135deg,var(--neon1),var(--neon4));
      color:#1A0A2E;box-shadow:0 3px 12px rgba(0,229,255,0.3);
    }
    .abtn-save:hover{transform:scale(1.03);}
    .abtn-use{
      grid-column:1/-1;
      background:linear-gradient(135deg,var(--neon3),var(--neon2));
      color:#fff;padding:0.8rem;font-size:0.65rem;
      border-radius:12px;box-shadow:0 4px 16px rgba(162,89,255,0.35);
    }
    .abtn-use:hover{transform:scale(1.02);box-shadow:0 6px 22px rgba(162,89,255,0.5);}
    .save-msg{font-size:0.7rem;color:var(--neon3);text-align:center;margin-top:0.4rem;min-height:1rem;font-weight:500;}

    /* ── Traits pane ── */
    .traits-pane{
      background:var(--card);
      border-radius:20px;
      padding:1.4rem;
      border:1.5px solid var(--border);
      box-shadow:0 4px 24px rgba(162,89,255,0.08);
    }

    /* Jump tags */
    .jump-tags{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:1.2rem;}
    .jtag{
      font-size:0.58rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;
      padding:0.28rem 0.75rem;border-radius:20px;cursor:pointer;transition:all 0.2s;
      background:#F0EEF8;color:var(--soft);border:1.5px solid transparent;
      font-family:'Inter',sans-serif;
    }
    .jtag:hover{border-color:var(--neon3);color:var(--neon3);}
    .jtag.active{
      background:linear-gradient(135deg,var(--neon3),var(--neon1));
      color:#fff;box-shadow:0 2px 10px rgba(0,229,255,0.25);
    }

    /* Section */
    .tsec{margin-bottom:1.4rem;}
    .tsec-head{
      display:flex;align-items:center;justify-content:space-between;
      cursor:pointer;padding:0.4rem 0;
      border-bottom:1.5px solid #F0EEF8;margin-bottom:0.9rem;
    }
    .tsec-head h3{
      font-size:0.62rem;font-weight:600;letter-spacing:0.18em;
      text-transform:uppercase;color:var(--soft);
    }
    .tsec-toggle{font-size:0.7rem;color:var(--neon3);transition:transform 0.2s;}
    .tsec-head.closed .tsec-toggle{transform:rotate(-90deg);}
    .tgrid{display:grid;gap:6px;transition:all 0.2s;}
    .tgrid.hidden{display:none;}

    /* Trait tiles */
    .ttile{
      border:2px solid rgba(162,89,255,0.12);border-radius:12px;
      cursor:pointer;display:flex;flex-direction:column;align-items:center;
      justify-content:center;padding:6px 4px;transition:all 0.18s;
      background:#FAFAFA;aspect-ratio:1;
    }
    .ttile:hover{border-color:var(--neon3);background:rgba(0,229,255,0.05);}
    .ttile.sel{
      border:2.5px solid var(--neon1);
      background:rgba(0,229,255,0.08);
      box-shadow:0 0 12px rgba(0,229,255,0.2);
    }
    .ttile-lbl{
      font-size:0.48rem;text-align:center;color:var(--soft);
      margin-top:3px;letter-spacing:0.05em;line-height:1.2;font-weight:500;
    }
    .none-tile{color:var(--soft);font-size:0.6rem;opacity:0.5;}

    /* Save look modal */
    .modal-bg{
      display:none;position:fixed;inset:0;
      background:rgba(26,10,46,0.4);backdrop-filter:blur(6px);
      z-index:500;align-items:center;justify-content:center;
    }
    .modal-bg.open{display:flex;}
    .modal-box{
      background:#fff;border-radius:20px;padding:2rem;
      width:90%;max-width:300px;text-align:center;
      border:2px solid var(--neon3);
      box-shadow:0 8px 40px rgba(162,89,255,0.2);
    }
    .modal-box h3{
      font-family:'Cormorant Garamond',serif;font-size:1.2rem;
      color:var(--ink);margin-bottom:1.1rem;letter-spacing:0.06em;
    }
    .modal-slots{display:flex;gap:0.6rem;justify-content:center;}
    .mslot-btn{
      flex:1;padding:0.6rem;border-radius:10px;border:none;cursor:pointer;
      font-family:'Inter',sans-serif;font-size:0.62rem;font-weight:600;
      letter-spacing:0.1em;text-transform:uppercase;
      background:linear-gradient(135deg,var(--neon3),var(--neon1));
      color:#fff;transition:all 0.2s;
    }
    .mslot-btn:hover{transform:scale(1.04);}
    .mcancel{
      margin-top:0.8rem;font-size:0.6rem;color:var(--soft);
      background:none;border:none;cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;
    }
  </style>
</head>
<body>

<!-- Chrome bar -->
<div class="chrome">
  <div class="chrome-dots">
    <span class="dot dot-r"></span>
    <span class="dot dot-a"></span>
    <span class="dot dot-g"></span>
  </div>
  <div class="chrome-title">✦ Avatar Studio</div>
  <div class="chrome-nav">
    <a class="chrome-btn" href="tree.html">← Tree</a>
    <button class="chrome-btn" onclick="skipAvatar()">Skip</button>
  </div>
</div>

<!-- Studio -->
<div class="studio">

  <!-- Preview -->
  <div class="preview-pane">
    <div class="preview-card">
      <span class="preview-label">Your Avatar</span>
      <div class="view-toggle">
        <button class="vtog active" onclick="setView('face',this)">Face</button>
        <button class="vtog" onclick="setView('body',this)">Full Body</button>
      </div>
      <canvas id="canvasFace" width="180" height="180"></canvas>
      <canvas id="canvasBody" width="180" height="260"></canvas>

      <div class="skin-row">
        <span class="skin-lbl">Skin</span>
        <input type="range" id="skinSlider" min="0" max="100" value="15" step="1" oninput="updateSkin(this.value)"/>
        <div class="skin-swatch" id="skinSwatch"></div>
      </div>

      <div style="font-size:0.52rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--soft);margin:0.8rem 0 0.4rem;">Saved Looks</div>
      <div class="looks-row">
        <div style="text-align:center;"><div class="look-slot" id="lk0" onclick="loadLook(0)"></div><div class="look-lbl">Look 1</div></div>
        <div style="text-align:center;"><div class="look-slot" id="lk1" onclick="loadLook(1)"></div><div class="look-lbl">Look 2</div></div>
        <div style="text-align:center;"><div class="look-slot" id="lk2" onclick="loadLook(2)"></div><div class="look-lbl">Look 3</div></div>
      </div>

      <div class="action-grid">
        <button class="abtn abtn-random" onclick="randomize()">✦ Surprise</button>
        <button class="abtn abtn-save" onclick="openSaveModal()">Save Look</button>
        <button class="abtn abtn-use" onclick="confirmAvatar()">✓ Use This Avatar</button>
      </div>
      <p class="save-msg" id="saveMsg"></p>
    </div>
  </div>

  <!-- Traits -->
  <div class="traits-pane">
    <div class="jump-tags" id="jumpTags"></div>
    <div id="traitsContainer"></div>
  </div>
</div>

<!-- Save modal -->
<div class="modal-bg" id="saveModal">
  <div class="modal-box">
    <h3>Save to which look?</h3>
    <div class="modal-slots">
      <button class="mslot-btn" onclick="saveLook(0)">Look 1</button>
      <button class="mslot-btn" onclick="saveLook(1)">Look 2</button>
      <button class="mslot-btn" onclick="saveLook(2)">Look 3</button>
    </div>
    <button class="mcancel" onclick="closeSaveModal()">Cancel</button>
  </div>
</div>

<script src="../assets/supabase.js"></script>
<script src="../assets/app.js"></script>
<script>
if (sessionStorage.getItem('chumchi_site') !== 'true') window.location.href = '../index.html';
const sess = JSON.parse(sessionStorage.getItem('chumchi_session') || 'null');
if (!sess) window.location.href = '../platform/login.html';
function skipAvatar(){ sessionStorage.setItem('chumchi_avatar_skipped','true'); window.location.href='tree.html'; }

// ── Skin palette — human + fantasy ──
const SKINS = [
  '#FDEBD8','#F5CBA7','#E8B48A','#D4956A','#C07850',
  '#A0623A','#7A4020','#4A2010','#2C1008',
  '#C8E8FF','#B0E0A0','#E0C0FF','#FFE0B0',
  '#A0D8F0','#90E890','#D0A0FF','#FF90A0',
  '#60C0FF','#40E040','#A040FF','#FF4080',
  '#1080C0','#208020','#6010C0','#C01040',
];

function skinFromSlider(v){
  return SKINS[Math.round(v / 100 * (SKINS.length - 1))];
}

let currentSkin = SKINS[2];
function updateSkin(v){
  currentSkin = skinFromSlider(v);
  document.getElementById('skinSwatch').style.background = currentSkin;
  drawAll();
}

// ── State ──
let S = {
  head:0, eyes:0, brows:0, mouth:0, nose:0, ears:0,
  hair:-1, hat:-1, outfit:0, sticker:-1, skin: '#E8B48A',
};
let savedLooks = [null,null,null];

// ── Canvas drawing helpers ──
const FC = () => document.getElementById('canvasFace');
const BC = () => document.getElementById('canvasBody');

function drawAll(){
  S.skin = currentSkin;
  drawFace(FC().getContext('2d'), 180, S);
  drawBody(BC().getContext('2d'), 180, 260, S);
  updateLookThumbnails();
}

function drawFace(ctx, sz, cfg){
  const s = sz;
  ctx.clearRect(0,0,s,s);
  const skin = cfg.skin;

  // Hair behind
  drawHair(ctx, s, cfg.hair, skin);
  // Ears
  drawEars(ctx, s, cfg.ears, skin);
  // Head
  drawHead(ctx, s, cfg.head, skin);
  // Hat
  if(cfg.hat >= 0) drawHat(ctx, s, cfg.hat);
  // Face features
  drawBrows(ctx, s, cfg.brows);
  drawEyes(ctx, s, cfg.eyes);
  drawNose(ctx, s, cfg.nose);
  drawMouth(ctx, s, cfg.mouth);
  // Sticker badge
  if(cfg.sticker >= 0){
    ctx.save();
    ctx.translate(s*0.72, s*0.04);
    ctx.scale(0.28,0.28);
    drawSticker(ctx, s, cfg.sticker);
    ctx.restore();
  }
}

function drawBody(ctx, w, h, cfg){
  const skin = cfg.skin;
  ctx.clearRect(0,0,w,h);
  // Draw head at top (small)
  ctx.save();
  ctx.translate(w*0.1, 0);
  ctx.scale(0.78, 0.78);
  drawFace(ctx, w, cfg);
  ctx.restore();

  const bx = w*0.18, by = h*0.56;
  const bw = w*0.64, bh = h*0.28;

  // Outfit/torso
  drawOutfit(ctx, w, h, cfg.outfit, skin);

  // Arms
  ctx.fillStyle = skin;
  // Left arm
  ctx.beginPath();
  ctx.roundRect(bx-w*0.1, by+bh*0.05, w*0.1, bh*0.55, 8);
  ctx.fill();
  // Right arm
  ctx.beginPath();
  ctx.roundRect(bx+bw, by+bh*0.05, w*0.1, bh*0.55, 8);
  ctx.fill();
  // Hands
  ctx.beginPath();
  ctx.arc(bx-w*0.05, by+bh*0.6, w*0.06, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(bx+bw+w*0.05, by+bh*0.6, w*0.06, 0, Math.PI*2);
  ctx.fill();

  // Sticker held in right hand
  if(cfg.sticker >= 0){
    ctx.save();
    ctx.translate(bx+bw+w*0.05-15, by+bh*0.6-30);
    ctx.scale(0.5, 0.5);
    drawSticker(ctx, 60, cfg.sticker);
    ctx.restore();
  }

  // Legs
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.roundRect(bx+bw*0.1, by+bh*0.92, bw*0.32, h*0.18, 8);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(bx+bw*0.58, by+bh*0.92, bw*0.32, h*0.18, 8);
  ctx.fill();
  // Feet
  ctx.beginPath();
  ctx.ellipse(bx+bw*0.26, by+bh*0.92+h*0.17, bw*0.16, h*0.04, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(bx+bw*0.74, by+bh*0.92+h*0.17, bw*0.16, h*0.04, 0, 0, Math.PI*2);
  ctx.fill();
}

// ── HEAD shapes ──
const HEADS = [
  {label:'Round',   fn:(ctx,s,skin)=>{ ctx.fillStyle=skin; ctx.beginPath(); ctx.arc(s/2,s/2,s*0.42,0,Math.PI*2); ctx.fill(); }},
  {label:'Square',  fn:(ctx,s,skin)=>{ ctx.fillStyle=skin; ctx.beginPath(); ctx.roundRect(s*0.1,s*0.12,s*0.8,s*0.76,s*0.1); ctx.fill(); }},
  {label:'Oval',    fn:(ctx,s,skin)=>{ ctx.fillStyle=skin; ctx.beginPath(); ctx.ellipse(s/2,s/2,s*0.35,s*0.44,0,0,Math.PI*2); ctx.fill(); }},
  {label:'Hex',     fn:(ctx,s,skin)=>{ ctx.fillStyle=skin; ctx.beginPath(); const pts=[[.5,.05],[.9,.27],[.9,.73],[.5,.95],[.1,.73],[.1,.27]]; ctx.moveTo(s*pts[0][0],s*pts[0][1]); pts.slice(1).forEach(p=>ctx.lineTo(s*p[0],s*p[1])); ctx.closePath(); ctx.fill(); }},
  {label:'Robot',   fn:(ctx,s,skin)=>{ ctx.fillStyle=skin; ctx.beginPath(); ctx.roundRect(s*.08,s*.14,s*.84,s*.72,s*.04); ctx.fill(); ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.beginPath(); ctx.roundRect(s*.08,s*.14,s*.84,s*.06,s*.04); ctx.fill(); }},
];
function drawHead(ctx,s,i,skin){ HEADS[i%HEADS.length].fn(ctx,s,skin); }

// ── EYES ──
const EYES = [
  {label:'Classic',  fn:(ctx,s)=>{ eyes(ctx,s,6,6,'circle'); }},
  {label:'Square',   fn:(ctx,s)=>{ eyes(ctx,s,9,7,'rect'); }},
  {label:'Wide',     fn:(ctx,s)=>{ eyes(ctx,s,9,6,'wide'); }},
  {label:'Dots',     fn:(ctx,s)=>{ eyes(ctx,s,4,4,'dot'); }},
  {label:'Sleepy',   fn:(ctx,s)=>{ sleepyEyes(ctx,s); }},
  {label:'Star',     fn:(ctx,s)=>{ starEyes(ctx,s); }},
  {label:'Heart',    fn:(ctx,s)=>{ heartEyes(ctx,s); }},
  {label:'Spiral',   fn:(ctx,s)=>{ spiralEyes(ctx,s); }},
  {label:'X Eyes',   fn:(ctx,s)=>{ xEyes(ctx,s); }},
  {label:'Pixel',    fn:(ctx,s)=>{ pixelEyes(ctx,s); }},
];
function eyes(ctx,s,rx,ry,type){
  [[s*.32,s*.44],[s*.68,s*.44]].forEach(([x,y])=>{
    ctx.fillStyle='#1A0A2E';
    if(type==='rect'){ctx.beginPath();ctx.roundRect(x-rx/2*s*.015,y-ry/2*s*.015,rx*s*.015,ry*s*.015,3);ctx.fill();}
    else if(type==='wide'){ctx.beginPath();ctx.ellipse(x,y,s*rx*.012,s*ry*.012,0,0,Math.PI*2);ctx.fill();}
    else{ctx.beginPath();ctx.arc(x,y,s*rx*.012,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='white';ctx.beginPath();ctx.arc(x-s*.02,y-s*.02,s*.028,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,229,255,0.6)';ctx.beginPath();ctx.arc(x-s*.01,y-s*.01,s*.012,0,Math.PI*2);ctx.fill();
  });
}
function sleepyEyes(ctx,s){
  [[s*.32,s*.44],[s*.68,s*.44]].forEach(([x,y])=>{
    ctx.fillStyle='#1A0A2E';ctx.beginPath();ctx.arc(x,y,s*.07,Math.PI,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(x-s*.08,y-s*.015,s*.16,s*.016);
  });
}
function starEyes(ctx,s){
  [[s*.32,s*.44],[s*.68,s*.44]].forEach(([x,y])=>{
    ctx.fillStyle='#FFD700';
    for(let i=0;i<5;i++){
      const a=i*Math.PI*2/5-Math.PI/2;
      const a2=a+Math.PI/5;
      ctx.beginPath();ctx.moveTo(x,y);
      ctx.lineTo(x+Math.cos(a)*s*.09,y+Math.sin(a)*s*.09);
      ctx.lineTo(x+Math.cos(a2)*s*.04,y+Math.sin(a2)*s*.04);
      ctx.closePath();ctx.fill();
    }
  });
}
function heartEyes(ctx,s){
  [[s*.32,s*.43],[s*.68,s*.43]].forEach(([x,y])=>{
    ctx.fillStyle='#FF2D9B';ctx.beginPath();
    ctx.moveTo(x,y+s*.06);
    ctx.bezierCurveTo(x,y,x-s*.07,y-s*.06,x-s*.07,y);
    ctx.bezierCurveTo(x-s*.07,y+s*.04,x,y+s*.09,x,y+s*.06);
    ctx.bezierCurveTo(x,y+s*.09,x+s*.07,y+s*.04,x+s*.07,y);
    ctx.bezierCurveTo(x+s*.07,y-s*.06,x,y,x,y+s*.06);
    ctx.fill();
  });
}
function spiralEyes(ctx,s){
  [[s*.32,s*.44],[s*.68,s*.44]].forEach(([x,y])=>{
    ctx.strokeStyle='#A259FF';ctx.lineWidth=s*.018;ctx.lineCap='round';
    ctx.beginPath();
    for(let t=0;t<6;t+=0.1){
      const r=t*s*.01;
      const px=x+Math.cos(t*2)*r;
      const py=y+Math.sin(t*2)*r;
      t<0.15?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.stroke();
  });
}
function xEyes(ctx,s){
  [[s*.32,s*.44],[s*.68,s*.44]].forEach(([x,y])=>{
    ctx.strokeStyle='#FF2D9B';ctx.lineWidth=s*.03;ctx.lineCap='round';
    const r=s*.06;
    ctx.beginPath();ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r);ctx.stroke();
  });
}
function pixelEyes(ctx,s){
  const pw=s*.05;
  [[s*.29,s*.41],[s*.65,s*.41]].forEach(([x,y])=>{
    [[0,0],[1,0],[0,1],[1,1]].forEach(([dx,dy])=>{
      ctx.fillStyle=dy===0&&dx===0?'#1A0A2E':'#A259FF';
      ctx.fillRect(x+dx*pw,y+dy*pw,pw-1,pw-1);
    });
  });
}
function drawEyes(ctx,s,i){ EYES[i%EYES.length].fn(ctx,s); }

];
function brow(ctx,s,type){
  ctx.strokeStyle='#5C3A1A';ctx.lineCap='round';
  [[s*.24,s*.36,s*.42,s*.32],[s*.58,s*.32,s*.76,s*.36]].forEach(([x1,y1,x2,y2])=>{

    ctx.lineWidth=type==='thick'?s*.04:s*.025;
    if(type==='flat'){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
    else{ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,x2,y2);ctx.stroke();}
  });
}

function mpath(ctx,x1,y1,cx,cy,x2,y2,col,fill){
  ctx.strokeStyle=col;ctx.lineWidth=ctx.canvas.width*.03;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);
  if(fill){ctx.fillStyle=col;ctx.fill();}else ctx.stroke();
}
function grinMouth(ctx,s){
  ctx.fillStyle='#1A0A2E';ctx.beginPath();ctx.moveTo(s*.28,s*.7);ctx.quadraticCurveTo(s*.5,s*.85,s*.72,s*.7);ctx.closePath();ctx.fill();
  ctx.fillStyle='white';ctx.fillRect(s*.33,s*.7,s*.34,s*.07);
  for(let i=0;i<4;i++){ctx.strokeStyle='#1A0A2E';ctx.lineWidth=s*.008;ctx.beginPath();ctx.moveTo(s*.38+i*s*.07,s*.7);ctx.lineTo(s*.38+i*s*.07,s*.77);ctx.stroke();}
}
function smirkMouth(ctx,s){
  ctx.strokeStyle='#5C1A1A';ctx.lineWidth=s*.028;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(s*.35,s*.73);ctx.quadraticCurveTo(s*.48,s*.8,s*.65,s*.7);ctx.stroke();

function teethMouth(ctx,s){
  ctx.fillStyle='#1A0A2E';ctx.beginPath();ctx.moveTo(s*.3,s*.69);ctx.quadraticCurveTo(s*.5,s*.82,s*.7,s*.69);ctx.closePath();ctx.fill();
  ctx.fillStyle='white';
  for(let i=0;i<4;i++){ctx.beginPath();ctx.roundRect(s*.34+i*s*.08,s*.695,s*.07,s*.06,2);ctx.fill();}
}
function tongueMouth(ctx,s){
  ctx.fillStyle='#1A0A2E';ctx.beginPath();ctx.moveTo(s*.3,s*.69);ctx.quadraticCurveTo(s*.5,s*.82,s*.7,s*.69);ctx.closePath();ctx.fill();
  ctx.fillStyle='#FF6B8A';ctx.beginPath();ctx.ellipse(s*.5,s*.795,s*.1,s*.07,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=s*.008;ctx.beginPath();ctx.moveTo(s*.5,s*.73);ctx.lineTo(s*.5,s*.86);ctx.stroke();
}
function kissMouth(ctx,s){
  ctx.fillStyle='#FF2D9B';ctx.beginPath();ctx.ellipse(s*.5,s*.73,s*.04,s*.06,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FF80B0';ctx.beginPath();ctx.arc(s*.43,s*.69,s*.025,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(s*.57,s*.69,s*.025,0,Math.PI*2);ctx.fill();
}
function catMouth(ctx,s){
  ctx.strokeStyle='#5C1A1A';ctx.lineWidth=s*.025;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(s*.43,s*.73);ctx.lineTo(s*.5,s*.71);ctx.lineTo(s*.57,s*.73);ctx.stroke();
  ctx.beginPath();ctx.moveTo(s*.35,s*.71);ctx.quadraticCurveTo(s*.43,s*.77,s*.43,s*.73);ctx.stroke();
  ctx.beginPath();ctx.moveTo(s*.65,s*.71);ctx.quadraticCurveTo(s*.57,s*.77,s*.57,s*.73);ctx.stroke();
}
function drawMouth(ctx,s,i){ MOUTHS[i%MOUTHS.length].fn(ctx,s); }

  {label:'Blonde',   fn:(ctx,s)=>{ hair(ctx,s,'#E8C87A',0.08); }},

];
function hair(ctx,s,col,t){
  ctx.fillStyle=col;ctx.beginPath();
  ctx.arc(s/2,s/2,s*0.42,Math.PI,Math.PI*2);
  ctx.quadraticCurveTo(s*0.9,s*0.38,s*0.88,s*0.5);
  ctx.lineTo(s*0.88,s*0.42);ctx.arc(s/2,s*0.42,s*0.38,0,Math.PI,true);
  ctx.lineTo(s*0.12,s*0.5);ctx.quadraticCurveTo(s*0.1,s*0.38,s*0.08,s*0.42);
  ctx.closePath();ctx.fill();
}
function hairLong(ctx,s,col){
  hair(ctx,s,col,0.08);
  ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(s*.08,s*.45,s*.1,s*.5,4);ctx.fill();
  ctx.beginPath();ctx.roundRect(s*.82,s*.45,s*.1,s*.5,4);ctx.fill();
}
function hairWavy(ctx,s,col){
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(s/2,s/2,s*0.42,Math.PI,0);ctx.fill();
  ctx.fillStyle=col;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.arc(s*(.2+i*.25),s*0.85,s*.08,0,Math.PI*2);ctx.fill();
  }
}
function hairCurly(ctx,s,col){
  ctx.fillStyle=col;
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI;
    const cx=s/2+Math.cos(a+Math.PI)*s*.38;
    const cy=s/2+Math.sin(a+Math.PI)*s*.38;
    ctx.beginPath();ctx.arc(cx,cy,s*.09,0,Math.PI*2);ctx.fill();
  }
}
function hairRainbow(ctx,s){
  const cols=['#FF0000','#FF7700','#FFFF00','#00FF00','#0000FF','#8B00FF'];
  cols.forEach((col,i)=>{
    ctx.fillStyle=col;ctx.globalAlpha=0.8;
    ctx.beginPath();ctx.arc(s/2,s/2,s*(0.42-i*.04),Math.PI,0);ctx.fill();
  });
  ctx.globalAlpha=1;
}
function hairMohawk(ctx,s,col){
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(s*.42,s*.28);ctx.lineTo(s*.46,s*.04);ctx.lineTo(s*.5,s*.0);
  ctx.lineTo(s*.54,s*.04);ctx.lineTo(s*.58,s*.28);ctx.closePath();ctx.fill();
}

  {label:'Pot',     fn:(ctx,s)=>{ ctx.fillStyle='#E8C87A';ctx.strokeStyle='#C4A050';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(s*.2,s*.4,s*.6,s*.45,s*.04);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(s*.5,s*.39,s*.32,s*.06,0,0,Math.PI*2);ctx.fill();ctx.stroke(); }},
  {label:'Chai',    fn:(ctx,s)=>{ ctx.fillStyle='#C4A050';ctx.beginPath();ctx.moveTo(s*.3,s*.25);ctx.lineTo(s*.7,s*.25);ctx.lineTo(s*.65,s*.7);ctx.lineTo(s*.35,s*.7);ctx.closePath();ctx.fill();ctx.fillStyle='#8B4513';ctx.beginPath();ctx.ellipse(s*.5,s*.48,s*.2,s*.12,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#C4A050';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s*.72,s*.45,s*.09,0,Math.PI*2);ctx.stroke(); }},
  {label:'Rolling Pin',fn:(ctx,s)=>{ ctx.fillStyle='#D4A060';ctx.beginPath();ctx.roundRect(s*.1,s*.42,s*.8,s*.16,8);ctx.fill();ctx.fillStyle='#C49050';ctx.beginPath();ctx.arc(s*.13,s*.5,s*.1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s*.87,s*.5,s*.1,0,Math.PI*2);ctx.fill(); }},
  {label:'Spatula',   fn:(ctx,s)=>{ ctx.fillStyle='#B0B0B0';ctx.beginPath();ctx.roundRect(s*.44,s*.08,s*.12,s*.5,4);ctx.fill();ctx.beginPath();ctx.roundRect(s*.35,s*.55,s*.3,s*.16,s*.04);ctx.fill();ctx.fillStyle='#888';ctx.fillRect(s*.46,s*.09,s*.08,s*.03); }},
  {label:'Tongs',     fn:(ctx,s)=>{ ctx.strokeStyle='#888';ctx.lineWidth=s*.045;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(s*.38,s*.15);ctx.lineTo(s*.38,s*.7);ctx.moveTo(s*.62,s*.15);ctx.lineTo(s*.62,s*.7);ctx.stroke();ctx.beginPath();ctx.arc(s*.5,s*.15,s*.12,0,Math.PI);ctx.stroke(); }},
  {label:'Baster',    fn:(ctx,s)=>{ ctx.fillStyle='#E8D8B0';ctx.beginPath();ctx.ellipse(s*.5,s*.3,s*.15,s*.2,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#C4A050';ctx.fillRect(s*.47,s*.48,s*.06,s*.4); }},
  {label:'Naan',      fn:(ctx,s)=>{ ctx.fillStyle='#E8C87A';ctx.beginPath();ctx.ellipse(s*.5,s*.5,s*.3,s*.4,0.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#C4A050';ctx.globalAlpha=0.4;for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(s*(.35+i*.1),s*(.35+i*.08),s*.06,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1; }},
  {label:'Mortar',    fn:(ctx,s)=>{ ctx.fillStyle='#D4C0A0';ctx.beginPath();ctx.arc(s*.5,s*.55,s*.28,0,Math.PI*2);ctx.fill();ctx.fillStyle='var(--bg)';ctx.beginPath();ctx.ellipse(s*.5,s*.46,s*.2,s*.12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#C0A880';ctx.fillRect(s*.47,s*.1,s*.06,s*.38); }},
];
function drawSticker(ctx,s,i){ if(i<0)return; STICKERS[(i+1)%STICKERS.length].fn(ctx,s); }

// ── TRAIT DEFINITIONS for UI ──
const TRAIT_DEFS = [
  { key:'head',    label:'Head Shape',              cols:5, items:HEADS  },
  { key:'eyes',    label:'Eyes',                    cols:5, items:EYES   },
  { key:'brows',   label:'Eyebrows',                cols:5, items:BROWS  },
  { key:'mouth',   label:'Mouth',                   cols:5, items:MOUTHS },
  { key:'nose',    label:'Nose',                    cols:5, items:NOSES  },
  { key:'ears',    label:'Ears',                    cols:5, items:EARS   },
  { key:'hair',    label:'Hair',                    cols:7, items:HAIRS  },
  { key:'hat',     label:'Hats & Head Gear',        cols:5, items:HATS   },
  { key:'outfit',  label:'Outfit',                  cols:5, items:OUTFITS},
  { key:'sticker', label:'Cooking Stickers',        cols:5, items:STICKERS},
];

// ── Build UI ──
function buildUI(){
  const tags = document.getElementById('jumpTags');
  const container = document.getElementById('traitsContainer');

  TRAIT_DEFS.forEach(def => {
    // Jump tag
    const tag = document.createElement('button');
    tag.className = 'jtag';
    tag.textContent = def.label.split(' ')[0];
    tag.onclick = () => {
      document.querySelectorAll('.jtag').forEach(t=>t.classList.remove('active'));
      tag.classList.add('active');
      document.getElementById('sec-'+def.key)?.scrollIntoView({behavior:'smooth',block:'start'});
    };
    tags.appendChild(tag);

    // Section
    const sec = document.createElement('div');
    sec.className='tsec'; sec.id='sec-'+def.key;

    const head = document.createElement('div');
    head.className='tsec-head';
    head.innerHTML=`<h3>${def.label}</h3><span class="tsec-toggle">▾</span>`;
    head.onclick=()=>{
      head.classList.toggle('closed');
      grid.classList.toggle('hidden');
    };
    sec.appendChild(head);

    const grid = document.createElement('div');
    grid.className='tgrid';
    grid.style.gridTemplateColumns=`repeat(${def.cols},1fr)`;

    const isOptional = ['hat','sticker'].includes(def.key);
    const offset = isOptional ? 0 : 1;

    def.items.forEach((item, idx) => {
      const tile = document.createElement('div');
      const stateVal = isOptional ? idx-1 : idx;
      tile.className='ttile' + (S[def.key]===stateVal?' sel':'');
      tile.dataset.trait=def.key;
      tile.dataset.val=stateVal;
      tile.title = item.label||'';
      tile.onclick=()=>{ S[def.key]=stateVal; syncTiles(def.key); drawAll(); };

      if(item.label==='None'||item.label==='Bald'){
        tile.innerHTML=`<span class="none-tile">${item.label||'None'}</span>`;
      } else {
        // Render thumbnail to small canvas
        const tc = document.createElement('canvas');
        tc.width=44; tc.height=44;
        tc.style.cssText='width:100%;height:auto;display:block;';
        const tctx = tc.getContext('2d');
        renderThumb(tctx, 44, def.key, idx, isOptional ? idx-1 : idx, item);
        tile.appendChild(tc);
        if(item.label){
          const lbl=document.createElement('div');
          lbl.className='ttile-lbl';
          lbl.textContent=item.label;
          tile.appendChild(lbl);
        }
      }
      grid.appendChild(tile);
    });

    sec.appendChild(grid);
    container.appendChild(sec);
  });
}

function renderThumb(ctx, s, key, idx, stateVal, item){
  const skin = '#E8B48A';
  ctx.clearRect(0,0,s,s);
  try {
    if(key==='head')    { HEADS[idx%HEADS.length].fn(ctx,s,skin); }
    else if(key==='eyes')   { drawEyes(ctx,s,idx); }
    else if(key==='brows')  { drawBrows(ctx,s,idx); }
    else if(key==='mouth')  { drawMouth(ctx,s,idx); }
    else if(key==='nose')   { drawNose(ctx,s,idx); }
    else if(key==='ears')   { drawEars(ctx,s,idx,skin); }
    else if(key==='hair')   { if(idx>0) HAIRS[idx].fn(ctx,s,skin); }
    else if(key==='hat')    { if(stateVal>=0) HATS[(stateVal+1)%HATS.length].fn(ctx,s); }
    else if(key==='outfit') { OUTFITS[idx%OUTFITS.length].fn(ctx,s,s,s*0.3,s*0.55,skin); }
    else if(key==='sticker'){ if(stateVal>=0) STICKERS[(stateVal+1)%STICKERS.length].fn(ctx,s); }
  } catch(e){}
}

function syncTiles(traitKey){
  document.querySelectorAll(`[data-trait="${traitKey}"]`).forEach(t=>{
    t.classList.toggle('sel', parseInt(t.dataset.val)===S[traitKey]);
  });
}
function syncAllTiles(){ TRAIT_DEFS.forEach(d=>syncTiles(d.key)); }

// ── View toggle ──
function setView(v,btn){
  document.getElementById('canvasFace').style.display = v==='face'?'block':'none';
  document.getElementById('canvasBody').style.display = v==='body'?'block':'none';
  document.querySelectorAll('.vtog').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ── Randomize ──
function randomize(){
  S.head    = Math.floor(Math.random()*HEADS.length);
  S.eyes    = Math.floor(Math.random()*EYES.length);
  S.brows   = Math.floor(Math.random()*BROWS.length);
  S.mouth   = Math.floor(Math.random()*MOUTHS.length);
  S.nose    = Math.floor(Math.random()*NOSES.length);
  S.ears    = Math.floor(Math.random()*EARS.length);
  S.hair    = Math.random()>0.1 ? Math.floor(Math.random()*(HAIRS.length-1))+1 : -1;
  S.hat     = Math.random()>0.5 ? Math.floor(Math.random()*(HATS.length-1)) : -1;
  S.outfit  = Math.floor(Math.random()*OUTFITS.length);
  S.sticker = Math.random()>0.5 ? Math.floor(Math.random()*(STICKERS.length-1)) : -1;
  const sv  = Math.floor(Math.random()*100);
  currentSkin = skinFromSlider(sv);
  S.skin = currentSkin;
  document.getElementById('skinSlider').value = sv;
  document.getElementById('skinSwatch').style.background = currentSkin;
  drawAll();
  syncAllTiles();
}

// ── Saved looks ──
function openSaveModal(){ document.getElementById('saveModal').classList.add('open'); }
function closeSaveModal(){ document.getElementById('saveModal').classList.remove('open'); }

function saveLook(slot){
  savedLooks[slot] = JSON.parse(JSON.stringify({...S, skin:currentSkin}));
  const el = document.getElementById('lk'+slot);
  el.classList.add('filled');
  el.innerHTML='';
  const mc=document.createElement('canvas');
  mc.width=52;mc.height=52;mc.style.cssText='width:100%;height:100%;';
  drawFace(mc.getContext('2d'),52,savedLooks[slot]);
  el.appendChild(mc);
  closeSaveModal();
  document.getElementById('saveMsg').textContent=`Look ${slot+1} saved!`;
  setTimeout(()=>{document.getElementById('saveMsg').textContent='';},2000);
  localStorage.setItem('chumchi_looks',JSON.stringify(savedLooks));
}

function loadLook(slot){
  if(!savedLooks[slot]) return;
  Object.assign(S, savedLooks[slot]);
  currentSkin = S.skin;
  const sv = SKINS.indexOf(currentSkin);
  document.getElementById('skinSlider').value = sv>=0 ? Math.round(sv/(SKINS.length-1)*100) : 15;
  document.getElementById('skinSwatch').style.background = currentSkin;
  drawAll(); syncAllTiles();
}

function updateLookThumbnails(){
  savedLooks.forEach((look,i)=>{
    if(!look) return;
    const el=document.getElementById('lk'+i);
    if(!el.classList.contains('filled')) return;
    const mc=el.querySelector('canvas');
    if(mc) drawFace(mc.getContext('2d'),52,look);
  });
}

// ── Confirm + animate ──
async function confirmAvatar(){
  S.skin = currentSkin;
  const btn = document.querySelector('.abtn-use');
  btn.textContent='Saving…'; btn.disabled=true;
  const memberId = sess?.memberId;
  localStorage.setItem('chumchi_avatar_'+(memberId||'guest'), JSON.stringify(S));
  sessionStorage.setItem('chumchi_avatar_set','true');
  if(memberId && typeof window.sb !== 'undefined'){
    sbReady(async()=>{
      await window.sb.from('members').update({avatar_config:JSON.stringify(S)}).eq('username',memberId);
    });
  }
  // Fun pose animation
  const fc = document.getElementById('canvasFace');
  const transforms=['rotate(-15deg)','rotate(15deg)','scale(1.18) rotate(-8deg)','scale(1.18) rotate(8deg)'];
  let i=0;
  fc.style.transition='transform 0.22s';
  const iv=setInterval(()=>{
    fc.style.transform=transforms[i%transforms.length]; i++;
    if(i>7){ clearInterval(iv); fc.style.transform='scale(0)'; setTimeout(()=>window.location.href='tree.html',350); }
  },200);
}

// ── Init ──
document.getElementById('skinSwatch').style.background = currentSkin;
document.getElementById('canvasBody').style.display='none';
buildUI();
drawAll();

try{
  const saved=localStorage.getItem('chumchi_looks');
  if(saved){ savedLooks=JSON.parse(saved); savedLooks.forEach((_,i)=>{ if(savedLooks[i]){ const el=document.getElementById('lk'+i); el.classList.add('filled');const mc=document.createElement('canvas');mc.width=52;mc.height=52;mc.style.cssText='width:100%;height:100%;';drawFace(mc.getContext('2d'),52,savedLooks[i]);el.appendChild(mc); } }); }
}catch(e){}

const memberId=sess?.memberId;
if(memberId){
  const loc=localStorage.getItem('chumchi_avatar_'+memberId);
  if(loc){ try{ const cfg=JSON.parse(loc); Object.assign(S,cfg); currentSkin=S.skin||currentSkin; document.getElementById('skinSlider').value=Math.max(0,SKINS.indexOf(currentSkin)); document.getElementById('skinSwatch').style.background=currentSkin; drawAll(); syncAllTiles(); }catch(e){} }
}
</script>
